<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d3d;color:white;font-family:system-ui,sans-serif}
    #game{position:absolute;inset:0;width:100%;height:100%;outline:none}
    #loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:16px;background:#101d3d}
    progress{width:240px;accent-color:#ffdf40}
    #error{max-width:640px;padding:24px;white-space:pre-wrap}
    #fullscreen{position:absolute;right:10px;bottom:10px;border:0;border-radius:6px;padding:6px 9px;background:#101d3d88;color:#fff;cursor:pointer;opacity:.65}
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="loading"><strong>얼음 경기장을 준비하고 있어요…</strong><progress id="progress" max="1" value="0"></progress><span id="error"></span></div>
  <button id="fullscreen" aria-label="전체 화면">⛶</button>
  <script>
    const canvas = document.getElementById('game');
    const loader = document.createElement('script');
    loader.src = 'Build/{{{ LOADER_FILENAME }}}';
    const showError = message => {
      document.getElementById('loading').style.display = 'grid';
      document.getElementById('error').textContent = '게임을 시작하지 못했어요. 새로고침해 주세요.\n' + message;
    };
    loader.onload = () => createUnityInstance(canvas, {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      autoSyncPersistentDataPath: true,
      // 고해상도 배율 때문에 픽셀 수가 몇 배로 늘어나는 것을 막는다.
      devicePixelRatio: 1,
      showBanner: (message,type) => { console[type === 'error' ? 'error' : 'warn'](message); if(type === 'error') showError(message); }
    }, value => document.getElementById('progress').value = value)
    .then(instance => {
      document.getElementById('loading').style.display = 'none';
      // 브라우저 IME 입력창도 함께 표시할 수 있도록 전체 body를 확대한다.
      document.getElementById('fullscreen').onclick = () => document.body.requestFullscreen ? document.body.requestFullscreen() : instance.SetFullscreen(1);
      canvas.focus();
    }).catch(showError);
    loader.onerror = () => showError('빌드 파일을 불러오지 못했습니다.');
    document.body.appendChild(loader);
    canvas.addEventListener('pointerdown', () => canvas.focus());
  </script>
</body>
</html>
